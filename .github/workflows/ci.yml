name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same PR/branch so queued runs do not pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (offline after module setup)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Every project-level step after the module setup step below (download
      # plus tidiness verification) runs with Go module and toolchain
      # resolution disabled.
      #
      # GOTOOLCHAIN=local, GOPROXY=off and GOSUMDB=off disable the Go
      # toolchain/module resolution only. They are NOT an OS network sandbox:
      # They do not sandbox the OS network and do not by themselves prove
      # that no network connection was opened. Runtime offline behavior
      # rests on code inspection (no network code in this bootstrap) and
      # side-effect-free tests; see the ADR for the honest statement of
      # what CI does and does not prove.
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      # The only network-dependent project step. `go mod download` alone does
      # not fetch the transitive test dependencies of dependencies that
      # `go mod tidy` loads on a fresh runner, so tidy is verified here while
      # the proxy is still available; the diff check fails on any
      # go.mod/go.sum drift.
      - name: Download modules and verify tidiness (build-time setup)
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          go mod download
          go mod tidy -diff
          git diff --exit-code

      - name: Verify module integrity
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build offline binary with CI-test version
        run: |
          go build -trimpath \
            -ldflags "-X github.com/PeterKopa/multi-agent-model-advisor/internal/app.version=ci-test" \
            -o "$RUNNER_TEMP/multi-agent-model-advisor" \
            ./cmd/multi-agent-model-advisor

      - name: Assert --version output
        run: |
          version_out="$("$RUNNER_TEMP/multi-agent-model-advisor" --version)"
          expected="multi-agent-model-advisor ci-test"
          echo "--version output: $version_out"
          if [ "$version_out" != "$expected" ]; then
            echo "unexpected --version output, expected: $expected" >&2
            exit 1
          fi

      - name: Assert --help output
        run: |
          if ! "$RUNNER_TEMP/multi-agent-model-advisor" --help \
            > "$RUNNER_TEMP/help-actual.txt" 2> "$RUNNER_TEMP/help-stderr.txt"; then
            echo "--help exited with a non-zero status, want exit 0" >&2
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/help-stderr.txt" ]; then
            echo "--help wrote to stderr, want empty:" >&2
            cat "$RUNNER_TEMP/help-stderr.txt" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/help-expected.txt" <<'EOF'
          Multi-Agent Model Advisor

          Usage: multi-agent-model-advisor [-h | --help] [--version]

          Options:
            -h, --help     Show this help and exit.
                --version  Print the version and exit.

          Running without any option starts the interactive TUI shell.
          The bootstrap screen does not load any project data.
          Press q or Ctrl+C to quit.
          EOF
          if ! diff -u "$RUNNER_TEMP/help-expected.txt" "$RUNNER_TEMP/help-actual.txt"; then
            echo "--help output differs from the expected stable text above" >&2
            exit 1
          fi

  # Separate quality/security jobs. Each is its own job (not a step of
  # build-test); all inherit the top-level permissions (contents: read) and
  # the top-level concurrency group. Unlike build-test's project-level
  # steps, these jobs run with ordinary module resolution and, where noted,
  # use the network — that is CI tooling traffic on the CI machine, not a
  # new property of the application, which stays offline at runtime.
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      # Network use: the action downloads the golangci-lint v2.15.0 binary
      # from GitHub releases. That download is the only online step here.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  govulncheck:
    name: Vulnerability check (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Keep Go itself on the toolchain pinned by go.mod.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      # Network use: downloading the govulncheck tool (Go module proxy) and
      # the vulnerability database (vuln.go.dev).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Scan for known vulnerabilities
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  # Deliberate Trivy policy: the gate covers fixed HIGH/CRITICAL
  # vulnerabilities plus secrets and misconfigurations at the selected
  # severity. `ignore-unfixed: true` means vulnerabilities with no available
  # fix are excluded from reported findings and the gate (the scan still
  # runs), and severities below HIGH
  # are not gated. A green run is evidence for this configured scope, not
  # proof that no vulnerabilities exist.
  trivy:
    name: Security scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Network use: the action downloads the Trivy v0.76.2 binary and its
      # vulnerability database. Findings fail the job (exit-code 1).
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          version: v0.76.2
          hide-progress: true

  workflow-lint:
    name: Workflow lint (jactionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Network use: the action downloads the jactionlint binary (pinned to
      # the action's own release), then lints the workflow files locally.
      # online: 'false' keeps jactionlint's own checks off the network.
      - name: Lint workflows
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          online: 'false'

  # Deterministic offline validation of the development-workflow rules. This
  # job is the CI evidence for AC-CI1: it checks out the exact pull-request
  # head, pins the base the change was reviewed against to an explicit
  # commit, and runs the same trusted commands a local run uses. It runs
  # `ci` and never `all`: the live release record does not exist yet and is
  # evaluated later, outside this job.
  #
  # The YAML shape is also asserted by `check_ci_workflow_contract()` in
  # tools/workflow_check.py, and `jactionlint` checks its syntax; neither
  # proves a passing run. The `workflow_validator_ci` slot of the release
  # record needs inspected run/job/step/log evidence on the reviewed head.
  #
  # Full history is required for two reasons: the plan-identity check reads
  # the reviewed plan section out of its commit, and the base assertion
  # resolves the recorded base commit in this checkout.
  workflow-validator:
    name: Workflow validator (trusted ci)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only a pull request carries the base the change is reviewed against; a
    # push or a manual dispatch has no comparable base to assert. Re-running
    # the pull-request run keeps its event, so no `workflow_dispatch` path is
    # needed. A skipped job is never green: it does not fill the CI slot.
    if: github.event_name == 'pull_request'
    env:
      # The explicit base this change was reviewed against: a commit identity,
      # never a branch name. A stale local `main` is environment state and
      # must not decide this check; when `main` advances, record the new base
      # deliberately in a reviewed commit instead of relabelling a result.
      EXPECTED_BASE_SHA: 17cf55aa0181bf16bf6b0c1c5942ce67bcc57119
      # The exact head under review: the pull-request head commit, not the
      # synthetic merge commit GitHub builds for the pull request.
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # The base repository owns the base branch. Checking the head out from a
      # fork makes `origin` the fork, so the base is fetched from here.
      BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
    steps:
      - name: Checkout the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Prints and asserts expected versus actual base and head. A mismatch
      # fails the job; it is not relabelled, skipped or resolved with
      # `continue-on-error`.
      - name: Assert the recorded base and head
        run: |
          set -euo pipefail
          # Resolve the base branch from the base repository, so a fork's own
          # `main` can never satisfy the assertion below.
          git fetch --no-tags "https://github.com/${BASE_REPOSITORY}" \
            "+refs/heads/main:refs/remotes/origin/main"
          actual_head="$(git rev-parse HEAD)"
          actual_base="$(git rev-parse refs/remotes/origin/main)"
          echo "expected head: ${EXPECTED_HEAD_SHA}"
          echo "actual head:   ${actual_head}"
          echo "expected base: ${EXPECTED_BASE_SHA}"
          echo "actual base:   ${actual_base}"
          if [ "${actual_head}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "checked-out head is not the reviewed pull-request head" >&2
            exit 1
          fi
          if [ "${actual_base}" != "${EXPECTED_BASE_SHA}" ]; then
            echo "origin/main does not resolve to the recorded base SHA" \
              "record the base deliberately instead of relabelling the check" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${EXPECTED_BASE_SHA}" HEAD; then
            echo "the recorded base is not an ancestor of the reviewed head" >&2
            exit 1
          fi

      - name: Audit the validator
        run: python3 tools/audit_validator.py

      - name: Run the trusted offline workflow checks
        run: python3 tools/workflow_check.py ci
